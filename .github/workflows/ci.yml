name: CI CD

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        name: Lint and tests
        runs-on: ubuntu-24.04
        services:
            mongodb:
                image: mongo:7.0.45
                ports: ['27017:27017']
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.23.3'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - run: npm run lint
            - run: npm test
              env:
                  DB_URL: mongodb://127.0.0.1:27017/testdb-test

    image:
        name: Build scan publish
        needs: quality
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
            - name: Build backend with layer cache
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: ./Dockerfile
                  tags: ${{ env.IMAGE }}
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Trivy report for HIGH and CRITICAL
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}
                  format: json
                  output: trivy.json
                  severity: HIGH,CRITICAL
                  exit-code: '0'
            - name: Print vulnerability counts
              run: |
                  echo "HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json)"
                  echo "CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json)"
            - name: Security gate — CRITICAL blocks release
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}
                  severity: CRITICAL
                  exit-code: '1'
                  format: table
                  skip-setup-trivy: true
            - name: Publish to GHCR
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
                  docker push "$IMAGE"

    deploy-smoke:
        name: Deploy and smoke test on CI runner
        needs: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        env:
            IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Start published image with compose
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
                  docker compose -f lab3/docker-compose.deploy.yml up -d --build
            - name: Check the deployed service
              run: |
                  for i in $(seq 1 60); do
                    if curl --noproxy '*' -ksSf --resolve lab.localhost:443:127.0.0.1 https://lab.localhost/api/ping; then
                      echo
                      docker compose -f lab3/docker-compose.deploy.yml ps
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose -f lab3/docker-compose.deploy.yml logs
                  exit 1
            - name: Stop demo stack
              if: always()
              run: docker compose -f lab3/docker-compose.deploy.yml down -v

    deploy-local:
        name: Deploy on local Windows runner
        needs: deploy-smoke
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_LOCAL_DEPLOY == 'true'
        runs-on: [self-hosted, windows, x64, vot-labs]
        permissions:
            contents: read
            packages: read
        env:
            IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
            LAB3_HTTP_PORT: '8080'
            LAB3_HTTPS_PORT: '8443'
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Deploy published image
              shell: powershell
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP 'lab3-docker-auth'
                  New-Item -ItemType Directory -Path $env:DOCKER_CONFIG -Force | Out-Null
                  $login = New-Object System.Diagnostics.ProcessStartInfo
                  $login.FileName = (Get-Command docker.exe).Source
                  $login.Arguments = "login ghcr.io -u $env:GITHUB_ACTOR --password-stdin"
                  $login.UseShellExecute = $false
                  $login.RedirectStandardInput = $true
                  $process = New-Object System.Diagnostics.Process
                  $process.StartInfo = $login
                  [void]$process.Start()
                  $process.StandardInput.Write($env:GH_TOKEN)
                  $process.StandardInput.Close()
                  $process.WaitForExit()
                  if ($process.ExitCode -ne 0) { exit $process.ExitCode }
                  docker compose -f lab3/docker-compose.deploy.yml -p vot-labs up -d --build
                  $composeExit = $LASTEXITCODE
                  docker logout ghcr.io | Out-Null
                  if ($composeExit -ne 0) { exit $composeExit }
            - name: Check local service
              shell: powershell
              run: |
                  for ($i = 0; $i -lt 60; $i++) {
                    & curl.exe --noproxy '*' -ksSf --resolve lab.localhost:8443:127.0.0.1 https://lab.localhost:8443/api/ping
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host "`nLocal service responds on https://lab.localhost:8443"
                      docker compose -f lab3/docker-compose.deploy.yml -p vot-labs ps
                      exit $LASTEXITCODE
                    }
                    Start-Sleep -Seconds 2
                  }
                  docker compose -f lab3/docker-compose.deploy.yml -p vot-labs logs
                  exit 1
